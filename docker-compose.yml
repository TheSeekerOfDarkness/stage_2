services:
  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: searchengine_ingestion
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      PORT: 7001
      DATALAKE_PATH: /data/datalake
    volumes:
      - ./datalake:/data/datalake

  indexing-service:
    build:
      context: ./indexing-service
      dockerfile: Dockerfile
    container_name: searchengine_indexing
    restart: unless-stopped
    ports:
      - "7002:7002"
    environment:
      PORT: 7002
      DATALAKE_PATH: /data/datalake
      DATAMART_PATH: /data/datamarts/datamart.db
    volumes:
      - ./datalake:/data/datalake
      - ./datamarts:/data/datamarts
    depends_on:
      - ingestion-service

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: searchengine_search
    restart: unless-stopped
    ports:
      - "7003:7003"
    environment:
      PORT: 7003
      DATAMART_PATH: /data/datamarts/datamart.db
    volumes:
      - ./datamarts:/data/datamarts
    depends_on:
      - indexing-service
